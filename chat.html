<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{CLIENT_NAME}} — AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            width: 100%;
            max-width: 700px;
            margin-bottom: 16px;
            text-align: center;
        }

        h1 {
            color: #1a73e8;
            font-size: 1.4rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
        }

        #chat-box {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .user-msg {
            background: #1a73e8;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            background: #e8f0fe;
            color: #202124;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .bot-msg strong { font-weight: 700; }
        .bot-msg a { color: #1a73e8; text-decoration: underline; }

        .loading {
            background: #e8f0fe;
            color: #888;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            font-style: italic;
        }

        .handoff-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.9rem;
            align-self: stretch;
            text-align: center;
        }

        #input-area {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 700px;
            margin-top: 12px;
        }

        #question {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #1a73e8;
            border-radius: 24px;
            font-size: 1rem;
            outline: none;
        }

        #question:focus { border-color: #0d47a1; }

        button {
            padding: 12px 24px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #0d47a1; }
        button:disabled { background: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{CLIENT_NAME}}</h1>
        <div class="subtitle">AI Dental Assistant</div>
    </div>

    <div id="chat-box"></div>

    <div id="input-area">
        <input type="text" id="question" placeholder="Ask something about our dental services..." />
        <button id="ask-btn" onclick="askBot()">Ask</button>
    </div>

    <script>
        const CLIENT_ID = "{{CLIENT_ID}}";
        const CLIENT_NAME = "{{CLIENT_NAME}}";
        const sessionId = Math.random().toString(36).substring(2);

        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('question');
        const btn = document.getElementById('ask-btn');

        function parseMarkdown(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>')
                .replace(/\n/g, '<br>');
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = 'message ' + type;
            if (type === 'bot-msg') {
                div.innerHTML = parseMarkdown(text);
            } else {
                div.innerText = text;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function addHandoffNotice() {
            const div = document.createElement('div');
            div.className = 'handoff-notice';
            div.innerHTML = '&#128222; Our team has been notified and will contact you shortly.';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function askBot() {
            const q = input.value.trim();
            if (!q) return;

            addMessage(q, 'user-msg');
            input.value = '';
            btn.disabled = true;

            const loadingDiv = addMessage('Thinking...', 'loading');

            try {
                const url = `/ask/${CLIENT_ID}?question=${encodeURIComponent(q)}&session_id=${sessionId}`;
                const res = await fetch(url);
                const data = await res.json();
                loadingDiv.remove();
                addMessage(data.answer || 'No response received.', 'bot-msg');
                if (data.handoff) addHandoffNotice();
            } catch (err) {
                loadingDiv.remove();
                addMessage('Connection error. Please try again.', 'bot-msg');
            }

            btn.disabled = false;
            input.focus();
        }

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') askBot();
        });

        addMessage(`Hello! I'm the AI assistant for **${CLIENT_NAME}**. How can I help you today?`, 'bot-msg');
    </script>
</body>
</html>
